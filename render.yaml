# One-click-ish deploy to Render.com (free tier works for personal use).
# After the first deploy, set PUBLIC_URL to the service's onrender.com URL and
# fill in the Twilio + phone secrets in the Render dashboard.
services:
  - type: web
    name: call-me-connector
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PUBLIC_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: USER_PHONE_NUMBER
        sync: false
      - key: ALLOW_NUMBER_OVERRIDE
        value: "false"
      - key: TIER
        value: "basic"
      - key: CONNECTOR_TOKEN
        sync: false
      - key: VALIDATE_TWILIO_SIGNATURE
        value: "true"
      # OAuth 2.1 — set both to enable (required for a public store listing).
      - key: OAUTH_SIGNING_SECRET
        generateValue: true
      - key: OWNER_ACCESS_CODE
        sync: false
      - key: VOICE
        value: Polly.Joanna
      - key: LANGUAGE
        value: en-US
      - key: SPEECH_TIMEOUT
        value: "10"
      # ---- Multi-tenant (SaaS) mode ----
      # Setting DATABASE_URL flips the connector into multi-tenant mode: users
      # sign up, verify their own number, and calls go to THEIR number.
      # Paste your Render Postgres "Internal Database URL" here.
      - key: DATABASE_URL
        sync: false
      # Twilio Verify service (identifier, not a secret) used to send OTP codes.
      - key: TWILIO_VERIFY_SERVICE_SID
        value: VA9271992ef3f0fc912cbd1ad4573bd26e
      # Verification channel: "sms" or "call".
      - key: VERIFY_CHANNEL
        value: sms
      # ---- SMS (Pro): text summary on no-answer + capture texted replies ----
      # The A2P 10DLC-registered Messaging Service SID. Setting this turns SMS ON.
      # Requires Twilio A2P 10DLC brand + campaign approval first.
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      # ---- Stripe billing ----
      # Setting STRIPE_SECRET_KEY turns on the paywall (calls require a
      # subscription). Leave blank until Stripe is set up.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_BASIC
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      # Comma-separated emails that bypass the paywall (store reviewers).
      - key: REVIEWER_EMAILS
        sync: false
